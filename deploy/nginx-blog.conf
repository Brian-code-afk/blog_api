# ============================================================
# 博客全站 Nginx 配置
# 放这里：/etc/nginx/sites-available/blog
# 启用  ：sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
#
# 两个角色合一：
#   1. 静态文件服务器 —— 把前端 dist/ 的文件直接吐给浏览器
#   2. 反向代理       —— 把 /api 的请求转给内部的 FastAPI
# 浏览器眼里只有同一个域名，所以不存在跨域
# ============================================================

# ---------- 80 端口：只做跳转，或用于签发证书 ----------
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;          # ← 换成你的域名

    # certbot 申请证书时要用这个路径，别删
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 已有证书后，所有 http 请求跳到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 端口：真正干活的 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;          # ← 换成你的域名

    # 证书路径由 certbot 自动写入（下面是它默认的位置）
    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 上传体积上限（文章正文可能很长，给足）
    client_max_body_size 10m;

    # 压缩：纯文本类才压，图片/字体本来已压缩，压了反而费 CPU
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # ---------- 前端静态站点 ----------
    root /var/www/blog;
    index index.html;

    # Vue 打包出的文件名带 hash，可以长久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 核心：找不到的路径一律交给 index.html
    # 前端用的是 history 模式，/article/xxx 这类地址在服务器上没有对应文件，
    # 不配这一行，用户刷新页面就会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不缓存，否则重新部署后用户还是看到旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        # 127.0.0.1:8000 对应 compose 里 web 服务映射的宿主端口
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端要能感知客户端断了，避免空转
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查接口，方便运维脚本探测
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Swagger 文档：生产环境建议关掉，避免暴露接口结构
    # 想临时看的话，把下面两行的注释去掉，或者用 SSH 隧道访问 127.0.0.1:8000/docs
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }
}
